<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>GabrielOS TV</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #060913; }
  body {
    color: white;
    font-family: 'Inter', 'SF Pro Display', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans Thai', 'Sarabun', sans-serif;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  }

  /* ===== พื้นหลัง: แสงออโรร่านุ่ม ๆ ซ้อนกันหลายชั้น ===== */
  .bg {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%; overflow: hidden;
    background:
      radial-gradient(1200px 720px at 10% -12%, rgba(99, 102, 241, 0.30), transparent 62%),
      radial-gradient(1000px 640px at 104% 112%, rgba(20, 184, 166, 0.20), transparent 62%),
      radial-gradient(900px 560px at 72% 18%, rgba(59, 130, 246, 0.13), transparent 60%),
      linear-gradient(180deg, #0d1426 0%, #060913 100%);
  }

  /* เวที 1920x1080 ย่อ/ขยายให้พอดีทุกหน้าจอ (TV = 1:1, มือถือ = ย่อส่วน) */
  .stage {
    position: absolute; top: 0; left: 0; width: 1920px; height: 1080px;
    transform-origin: 0 0; overflow: hidden;
  }
  /* ลูกแสงสีลอยช้า ๆ เติมพื้นที่ว่างด้านบน (ใช้เฉพาะ transform เบามาก) */
  .bg::before, .bg::after { content: ''; position: absolute; border-radius: 50%; will-change: transform; }
  .bg::before {
    width: 1100px; height: 1100px; left: -220px; top: -320px;
    background: radial-gradient(circle, rgba(99, 102, 241, 0.26), rgba(99, 102, 241, 0) 66%);
    animation: drift1 26s ease-in-out infinite alternate;
  }
  .bg::after {
    width: 1000px; height: 1000px; right: -260px; top: 60px;
    background: radial-gradient(circle, rgba(236, 72, 153, 0.10), rgba(20, 184, 166, 0.08) 46%, rgba(20, 184, 166, 0) 68%);
    animation: drift2 32s ease-in-out infinite alternate;
  }
  @keyframes drift1 { from { transform: translate(0, 0) scale(1); } to { transform: translate(300px, 170px) scale(1.18); } }
  @keyframes drift2 { from { transform: translate(0, 0) scale(1); } to { transform: translate(-320px, 130px) scale(1.22); } }

  /* ===== เอฟเฟกต์พื้นหลังระดับพรีเมียม (เลเยอร์ตกแต่งล้วน ไม่กระทบการทำงาน) ===== */
  .fx { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; z-index: -1; pointer-events: none; overflow: hidden; }
  .fx i { position: absolute; display: block; will-change: transform; }
  .fx::after {
    content: ''; position: absolute; left: 0; top: 0; right: 0; bottom: 0;
    background: radial-gradient(ellipse at 50% 42%, transparent 52%, rgba(2, 3, 8, 0.55) 100%);
  }

  /* โทนสีเปลี่ยนตามแอปที่เลือก (ค่าสีมาจาก JS ผ่าน --t / --t-rgb / --t2) */
  .stage { --t: #6366f1; --t-rgb: 99, 102, 241; --t2: #14b8a6; }
  .fx-tint { display: none; border-radius: 50%; transition: background-color 1.2s ease; }
  @supports ((-webkit-mask-image: radial-gradient(#000, #000)) or (mask-image: radial-gradient(#000, #000))) {
    .fx-tint {
      display: block;
      -webkit-mask-image: radial-gradient(closest-side, rgba(0,0,0,0.95), rgba(0,0,0,0.4) 48%, rgba(0,0,0,0) 100%);
      mask-image: radial-gradient(closest-side, rgba(0,0,0,0.95), rgba(0,0,0,0.4) 48%, rgba(0,0,0,0) 100%);
    }
  }
  .fx-tint.a { left: 880px; top: -300px; width: 1560px; height: 1560px; background-color: var(--t); animation: tintA 10s ease-in-out infinite alternate; }
  .fx-tint.b { left: -460px; top: -160px; width: 1250px; height: 1250px; background-color: var(--t2); opacity: 0.34; }
  .fx-tint.c { left: -160px; top: 620px; width: 1400px; height: 760px; background-color: var(--t); opacity: 0.34; }
  @keyframes tintA { from { transform: scale(1); opacity: 0.46; } to { transform: scale(1.1); opacity: 0.66; } }
  @keyframes glow {
    from { box-shadow: 0 0 0 4px #fff4dc, 0 24px 52px var(--g, rgba(59, 130, 246, 0.6)); }
    to   { box-shadow: 0 0 0 4px #fff4dc, 0 34px 86px var(--g, rgba(59, 130, 246, 0.6)); }
  }

  /* ลำแสงสปอตไลต์จากด้านบน แกว่งช้า ๆ */
  .fx-beams {
    left: 50%; top: -60px; width: 2800px; height: 1500px; margin-left: -1400px; transform-origin: 50% 0;
    background: conic-gradient(from 145deg at 50% 0%,
      rgba(0,0,0,0) 0deg, rgba(190,200,255,0.13) 7deg, rgba(0,0,0,0) 15deg,
      rgba(0,0,0,0) 21deg, rgba(240,222,182,0.12) 29deg, rgba(0,0,0,0) 37deg,
      rgba(0,0,0,0) 43deg, rgba(150,170,255,0.10) 51deg, rgba(0,0,0,0) 59deg,
      rgba(0,0,0,0) 70deg);
    -webkit-mask-image: linear-gradient(to bottom, #000 0%, rgba(0,0,0,0) 80%);
    mask-image: linear-gradient(to bottom, #000 0%, rgba(0,0,0,0) 80%);
    animation: sway 16s ease-in-out infinite alternate;
  }
  @keyframes sway { from { transform: rotate(-5deg); } to { transform: rotate(5deg); } }

  /* แสงเรืองด้านหลังวงโคจร */
  .fx-glow {
    left: 1010px; top: -210px; width: 1400px; height: 1400px;
    background: radial-gradient(circle, rgba(232, 213, 168, 0.11), rgba(232, 213, 168, 0.03) 42%, rgba(0,0,0,0) 66%);
    animation: breathe 9s ease-in-out infinite alternate;
  }
  @keyframes breathe { from { transform: scale(1); opacity: 0.75; } to { transform: scale(1.1); opacity: 1; } }

  /* วงโคจรเส้นบางพร้อมดาวหางแสงวิ่งรอบ */
  .fx-ring { border-radius: 50%; border: 1px solid rgba(255, 255, 255, 0.06); }
  .r1 { left: 1160px; top: -60px; width: 1100px; height: 1100px; }
  .r2 { left: 930px; top: -290px; width: 1560px; height: 1560px; }
  .r3 { left: 1360px; top: 140px; width: 700px; height: 700px; border-color: rgba(232, 213, 168, 0.12); }
  .r1, .r2 { border-color: rgba(var(--t-rgb), 0.22); transition: border-color 1.2s ease; }
  .r3 { border-color: rgba(var(--t-rgb), 0.38); transition: border-color 1.2s ease; }
  @supports ((-webkit-mask-image: radial-gradient(#000, #000)) or (mask-image: radial-gradient(#000, #000))) {
    .fx-ring::before {
      content: ''; position: absolute; left: -1px; top: -1px; right: -1px; bottom: -1px; border-radius: 50%;
      -webkit-mask-image: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 2px));
      mask-image: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 2px));
      animation: spin 20s linear infinite;
    }
    .r1::before { background: conic-gradient(rgba(232,213,168,0) 0deg, rgba(232,213,168,0) 240deg, rgba(232,213,168,0.95) 358deg, rgba(255,255,255,0) 360deg); }
    .r2::before { background: conic-gradient(rgba(165,180,252,0) 0deg, rgba(165,180,252,0) 270deg, rgba(190,200,255,0.9) 358deg, rgba(255,255,255,0) 360deg); animation-duration: 36s; animation-direction: reverse; }
    .r3::before { background: conic-gradient(rgba(232,213,168,0) 0deg, rgba(232,213,168,0) 200deg, rgba(255,240,205,1) 358deg, rgba(255,255,255,0) 360deg); animation-duration: 13s; }
  }
  @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

  /* ฝุ่นแสงทองลอยขึ้นช้า ๆ */
  .fx-dust {
    left: 0; top: 0; width: 1920px; height: 2160px;
    background-size: 1920px 1080px; background-repeat: repeat-y;
    background-image:
      radial-gradient(2.5px 2.5px at 150px 120px, rgba(232,213,168,0.9), transparent),
      radial-gradient(1.5px 1.5px at 380px 300px, rgba(255,255,255,0.7), transparent),
      radial-gradient(3px 3px at 610px 180px, rgba(232,213,168,0.85), transparent),
      radial-gradient(2px 2px at 820px 420px, rgba(255,255,255,0.6), transparent),
      radial-gradient(1.5px 1.5px at 1050px 140px, rgba(255,255,255,0.7), transparent),
      radial-gradient(3px 3px at 1270px 360px, rgba(232,213,168,0.8), transparent),
      radial-gradient(2px 2px at 1490px 200px, rgba(255,255,255,0.65), transparent),
      radial-gradient(2.5px 2.5px at 1700px 420px, rgba(232,213,168,0.85), transparent),
      radial-gradient(1.5px 1.5px at 1830px 150px, rgba(255,255,255,0.7), transparent),
      radial-gradient(2px 2px at 240px 560px, rgba(255,255,255,0.6), transparent),
      radial-gradient(2.5px 2.5px at 520px 700px, rgba(232,213,168,0.8), transparent),
      radial-gradient(1.5px 1.5px at 760px 860px, rgba(255,255,255,0.6), transparent),
      radial-gradient(2px 2px at 980px 600px, rgba(232,213,168,0.8), transparent),
      radial-gradient(1.5px 1.5px at 1210px 780px, rgba(255,255,255,0.6), transparent),
      radial-gradient(3px 3px at 1430px 640px, rgba(232,213,168,0.8), transparent),
      radial-gradient(2px 2px at 1650px 820px, rgba(255,255,255,0.6), transparent),
      radial-gradient(1.5px 1.5px at 1840px 700px, rgba(232,213,168,0.7), transparent),
      radial-gradient(2px 2px at 90px 900px, rgba(255,255,255,0.6), transparent),
      radial-gradient(2.5px 2.5px at 330px 1000px, rgba(232,213,168,0.8), transparent),
      radial-gradient(2px 2px at 1100px 1020px, rgba(255,255,255,0.6), transparent),
      radial-gradient(11px 11px at 700px 520px, rgba(232,213,168,0.16), transparent),
      radial-gradient(13px 13px at 1560px 300px, rgba(165,180,252,0.2), transparent),
      radial-gradient(10px 10px at 300px 230px, rgba(255,255,255,0.12), transparent),
      radial-gradient(12px 12px at 1330px 930px, rgba(232,213,168,0.14), transparent);
    animation: rise 70s linear infinite;
  }
  @keyframes rise { from { transform: translateY(0); } to { transform: translateY(-1080px); } }
  /* แสงวาบเฉียงพาดผ่านจอเป็นระยะ */
  .fx-sheen {
    left: 0; top: -300px; width: 420px; height: 1700px;
    background: linear-gradient(90deg, rgba(255,255,255,0), rgba(255,244,220,0.07), rgba(255,255,255,0));
    transform: translateX(-800px) rotate(18deg);
    animation: sheen 15s ease-in-out infinite;
  }
  @keyframes sheen { 0% { transform: translateX(-800px) rotate(18deg); } 45%, 100% { transform: translateX(2700px) rotate(18deg); } }
  @media (prefers-reduced-motion: reduce) {
    .bg::before, .bg::after, .fx i, .fx-ring::before, .app-icon.focused { animation: none; }
  }

  /* แสงขอบฟ้าด้านล่าง + เงาไล่ระดับให้ dock อ่านง่าย (เบากว่าเดิม จะได้ไม่ดำทึบ) */
  .stage::before {
    content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 520px;
    background:
      radial-gradient(1500px 380px at 50% 100%, rgba(99, 102, 241, 0.30), transparent 72%),
      linear-gradient(to top, rgba(3, 5, 11, 0.70) 0%, rgba(3, 5, 11, 0.30) 55%, transparent 100%);
    pointer-events: none;
  }

  .top-bar {
    position: absolute; top: 48px; left: 70px; right: 70px;
    display: flex; justify-content: space-between; align-items: center;
  }
  .brand {
    font-size: 34px; font-weight: 800; letter-spacing: -0.8px;
    background: linear-gradient(100deg, #ffffff 15%, #ecdcb4 100%);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .status {
    display: flex; align-items: center; font-size: 22px; color: #cbd5e1; font-weight: 500;
    padding: 12px 28px; border-radius: 999px;
    background: rgba(255, 255, 255, 0.06); border: 1px solid rgba(255, 255, 255, 0.09);
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
  }
  .status > * + * { margin-left: 18px; }
  #clock { font-size: 28px; font-weight: 700; color: #fff; letter-spacing: 0.5px; font-variant-numeric: tabular-nums; }
  .net { display: flex; color: #e2e8f0; }
  .net svg { display: block; }

  .app-label-container {
    position: absolute; bottom: 228px; left: 70px; max-width: 900px;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .app-name {
    font-size: 72px; font-weight: 800; margin: 0 0 12px 0; letter-spacing: -2px; line-height: 1.1;
    text-shadow: 0 4px 24px rgba(0, 0, 0, 0.45);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .app-desc { font-size: 24px; color: #a8b5cb; margin: 0; line-height: 1.5; max-width: 700px; }

  /* ===== Dock: แท่งกระจกฝ้ารองรับไอคอน ===== */
  .dock {
    position: absolute; left: 0; bottom: 0; z-index: 1;
    display: flex; padding: 0 74px 60px 74px; align-items: center;
  }
  .dock::before {
    content: ''; position: absolute; z-index: -1;
    left: 44px; right: 44px; top: -24px; bottom: 36px; border-radius: 56px;
    background: linear-gradient(180deg, rgba(255, 255, 255, 0.10), rgba(255, 255, 255, 0.04));
    border: 1px solid rgba(255, 255, 255, 0.10);
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(var(--t-rgb), 0.60);
    transition: box-shadow 1s ease;
  }
  @supports ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
    .dock::before { -webkit-backdrop-filter: blur(24px); backdrop-filter: blur(24px); }
  }
  .dock > * + * { margin-left: 30px; }
  .app-icon {
    position: relative;
    flex: 0 0 auto; width: 104px; height: 104px; border-radius: 33px;
    display: flex; justify-content: center; align-items: center;
    font-size: 40px; font-weight: 800;
    transition: all 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
    cursor: pointer; background: var(--c, #3b82f6); color: white;
    border: 0; overflow: hidden;
    box-shadow: 0 8px 22px rgba(0, 0, 0, 0.40), inset 0 1px 0 rgba(255, 255, 255, 0.14);
  }
  /* เงาแสงสะท้อนบนผิวไอคอน */
  .app-icon::after {
    content: ''; position: absolute; left: 0; top: 0; right: 0; bottom: 0;
    background: linear-gradient(160deg, rgba(255, 255, 255, 0.24) 0%, rgba(255, 255, 255, 0) 45%, rgba(0, 0, 0, 0.22) 100%);
    pointer-events: none;
  }
  .app-icon svg { display: block; }
  .app-icon img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .app-icon.focused {
    transform: scale(1.3) translateY(-8px);
    animation: glow 2.6s ease-in-out infinite alternate;
    background: var(--c, #3b82f6);
    box-shadow: 0 0 0 4px #fff4dc, 0 26px 56px var(--g, rgba(59, 130, 246, 0.6));
  }

  /* ===== All Apps drawer (frosted glass) ===== */
  .drawer {
    position: absolute; top: 0; left: 0; width: 1920px; height: 1080px; z-index: 20;
    padding: 56px 90px 0 90px;
    background: rgba(7, 10, 18, 0.94);
    opacity: 0; visibility: hidden;
    transition: opacity 0.25s ease, visibility 0.25s;
  }
  @supports ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
    .drawer {
      background:
        radial-gradient(1000px 600px at 90% -10%, rgba(99, 102, 241, 0.22), transparent 62%),
        radial-gradient(900px 560px at 0% 110%, rgba(20, 184, 166, 0.14), transparent 62%),
        rgba(12, 18, 33, 0.58);
      -webkit-backdrop-filter: blur(44px) saturate(150%);
      backdrop-filter: blur(44px) saturate(150%);
    }
  }
  .drawer.open { opacity: 1; visibility: visible; }
  .drawer-head { display: flex; align-items: center; justify-content: space-between; height: 96px; padding: 0 10px; }
  .drawer-title { margin: 0; font-size: 50px; font-weight: 800; letter-spacing: -1.5px; text-shadow: 0 4px 30px rgba(0, 0, 0, 0.4); }
  .drawer-right { display: flex; align-items: center; }
  .drawer-hint {
    font-size: 20px; color: #a8b5cb;
    padding: 12px 24px; border-radius: 999px;
    background: rgba(255, 255, 255, 0.06); border: 1px solid rgba(255, 255, 255, 0.08);
  }
  .drawer-close {
    width: 66px; height: 66px; border-radius: 50%; margin-left: 24px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    background: rgba(255, 255, 255, 0.10); border: 1px solid rgba(255, 255, 255, 0.14);
  }
  .grid {
    position: relative; height: calc(100% - 96px); overflow-y: auto; overflow-x: hidden;
    padding: 30px 10px 80px 10px;
    display: grid; grid-template-columns: repeat(7, 1fr); grid-gap: 30px 16px;
    align-content: start;
  }
  .grid::-webkit-scrollbar { display: none; }
  .tile {
    display: flex; flex-direction: column; align-items: center;
    padding: 24px 8px 20px 8px; border-radius: 34px; cursor: pointer;
    border: 2px solid transparent;
    transition: background 0.2s, border-color 0.2s, box-shadow 0.2s;
  }
  .t-wrap { position: relative; width: 112px; height: 112px; }
  .t-icon {
    width: 112px; height: 112px; border-radius: 34px; overflow: hidden;
    background: linear-gradient(145deg, #2a3750, #19223a); color: #fff; border: 2px solid transparent;
    display: flex; align-items: center; justify-content: center;
    font-size: 40px; font-weight: 800;
    box-shadow: 0 8px 22px rgba(0, 0, 0, 0.38), inset 0 1px 0 rgba(255, 255, 255, 0.12);
    transition: all 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
  }
  .t-icon img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .t-icon svg { display: block; }
  .t-name {
    margin-top: 20px; font-size: 22px; font-weight: 600; color: #b4c0d4; text-align: center;
    max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .badge {
    position: absolute; top: -8px; right: -8px; width: 36px; height: 36px; border-radius: 50%;
    background: linear-gradient(145deg, #60a5fa, #3b82f6); border: 3px solid #0f172a;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 6px 14px rgba(59, 130, 246, 0.45);
  }
  .tile.focused {
    background: linear-gradient(160deg, rgba(255, 255, 255, 0.15), rgba(255, 255, 255, 0.05));
    border-color: rgba(255, 255, 255, 0.32);
    box-shadow: 0 22px 50px rgba(0, 0, 0, 0.38);
  }
  .tile.focused .t-icon {
    transform: scale(1.18); border-color: #fff;
    box-shadow: 0 16px 40px var(--g, rgba(59, 130, 246, 0.55));
  }
  .tile.focused .t-name { color: #fff; font-weight: 700; }

  /* ===== Context menu ===== */
  .menu-wrap {
    position: absolute; top: 0; left: 0; width: 1920px; height: 1080px; z-index: 30;
    display: flex; justify-content: center; align-items: center;
    background: radial-gradient(900px 600px at 50% 50%, rgba(0, 0, 0, 0.45), rgba(0, 0, 0, 0.72));
    opacity: 0; visibility: hidden; transition: opacity 0.2s, visibility 0.2s;
  }
  .menu-wrap.open { opacity: 1; visibility: visible; }
  .menu {
    width: 580px; padding: 38px; border-radius: 38px;
    background: linear-gradient(180deg, rgba(38, 50, 72, 0.98), rgba(24, 33, 52, 0.98));
    border: 1px solid rgba(255, 255, 255, 0.14);
    box-shadow: 0 40px 100px rgba(0, 0, 0, 0.65), inset 0 1px 0 rgba(255, 255, 255, 0.10);
  }
  .menu-head { display: flex; align-items: center; margin-bottom: 22px; padding-bottom: 22px; border-bottom: 1px solid rgba(255, 255, 255, 0.08); }
  .menu-head .mi {
    flex: 0 0 auto; width: 68px; height: 68px; border-radius: 22px; overflow: hidden; margin-right: 20px;
    background: #0b0f19; display: flex; align-items: center; justify-content: center;
    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.4);
  }
  .menu-head .mi img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .menu-head .mi svg { display: block; }
  .menu-title { font-size: 32px; font-weight: 800; letter-spacing: -0.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .menu-item {
    margin-top: 10px; padding: 22px 26px; border-radius: 20px; font-size: 26px; font-weight: 600;
    color: #cbd5e1; cursor: pointer; transition: background 0.15s, color 0.15s;
  }
  .menu-item.focused { background: #ffffff; color: #0b0f19; box-shadow: 0 12px 30px rgba(255, 255, 255, 0.16); }
  .menu-item.disabled { opacity: 0.45; }

  .toast {
    position: absolute; top: 140px; left: 50%; z-index: 40;
    transform: translate(-50%, 10px); padding: 18px 38px; border-radius: 999px;
    background: rgba(30, 41, 59, 0.96); border: 1px solid rgba(255, 255, 255, 0.16);
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
    font-size: 24px; font-weight: 600; color: #fff; opacity: 0; pointer-events: none; white-space: nowrap;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
</style>
</head>
<body>
  <div class="bg"></div>

  <div class="stage" id="stage">

<script>
(function () {

  ];

  var ICON = {
    play: '<svg width="46" height="46" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l12.5-7.5z"/></svg>',
    music: '<svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3" fill="currentColor"/><circle cx="17" cy="16" r="3" fill="currentColor"/></svg>',
    check: '<svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 12.5l5 5L19.5 7"/></svg>',

    gear: '<svg width="54" height="54" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>',
    wifiBig: '<svg width="54" height="54" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12.55a11 11 0 0 1 14.08 0"></path><path d="M1.42 9a16 16 0 0 1 21.16 0"></path><path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path><line x1="12" y1="20" x2="12.01" y2="20"></line></svg>',
    pin: '<svg width="18" height="18" viewBox="0 0 24 24" fill="#fff"><path d="M16 9V4h1c.55 0 1-.45 1-1s-.45-1-1-1H7c-.55 0-1 .45-1 1s.45 1 1 1h1v5c0 1.66-1.34 3-3 3v2h5.97v7l1 1 1-1v-7H19v-2c-1.66 0-3-1.34-3-3z"/></svg>',
    close: '<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>'
  };
  var NET = {
    wifi: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12.55a11 11 0 0 1 14.08 0"></path><path d="M1.42 9a16 16 0 0 1 21.16 0"></path><path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path><line x1="12" y1="20" x2="12.01" y2="20"></line></svg>',
    ethernet: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="5"/><rect x="2" y="16" width="6" height="5"/><rect x="16" y="16" width="6" height="5"/><path d="M12 8v4M5 16v-4h14v4"/></svg>',
    none: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="opacity:.45"><path d="M5 12.55a11 11 0 0 1 14.08 0"></path><path d="M1.42 9a16 16 0 0 1 21.16 0"></path><path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path><line x1="12" y1="20" x2="12.01" y2="20"></line><line x1="3" y1="3" x2="21" y2="21"></line></svg>'
  };

  /* ---------- State ---------- */
  var state = {
    mode: 'home',            // home | drawer | menu
    focus: 0, apps: [], pins: [], hidden: [], dockItems: [],
    drawerList: [], drawerFocus: 0,
    menuItems: [], menuFocus: 0, menuApp: null, menuFrom: 'drawer'
  };

  function $(id) { return document.getElementById(id); }
  var stage = $('stage'), dock = $('dock'), nameEl = $('appName'), descEl = $('appDesc'), labelBox = $('labelBox'),
      drawer = $('drawer'), grid = $('grid'), menuWrap = $('menuWrap'), menuEl = $('menu'), toastEl = $('toast'),
      netEl = $('net'), clockEl = $('clock'), dateEl = $('date');
  $('drawerClose').innerHTML = ICON.close;

  /* ---------- Scale stage ---------- */
  function fit() {
    var s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    var x = (window.innerWidth - 1920 * s) / 2, y = (window.innerHeight - 1080 * s) / 2;
    stage.style.transform = 'translate(' + x + 'px,' + y + 'px) scale(' + s + ')';
  }
  window.addEventListener('resize', fit);
  fit();

  /* ---------- Helpers ---------- */
  function rgba(hex, a) {
    var h = hex.replace('#', '');
    if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
    var n = parseInt(h, 16);
    return 'rgba(' + ((n >> 16) & 255) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')';
  }
  function hex2(n) { return (n < 16 ? '0' : '') + n.toString(16); }

  /* โทนสีของฉากหลังเปลี่ยนตามแอปที่เลือก */
  function hueShift(hex, deg) {
    var n = parseInt(hex.replace('#', ''), 16), r = ((n >> 16) & 255) / 255, g = ((n >> 8) & 255) / 255, b = (n & 255) / 255;
    var mx = Math.max(r, g, b), mn = Math.min(r, g, b), l = (mx + mn) / 2, h = 0, sat = 0, d = mx - mn;
    if (d) {
      sat = l > 0.5 ? d / (2 - mx - mn) : d / (mx + mn);
      if (mx === r) h = (g - b) / d + (g < b ? 6 : 0); else if (mx === g) h = (b - r) / d + 2; else h = (r - g) / d + 4;
      h *= 60;
    }
    h = (h + deg + 360) % 360; sat = Math.max(sat, 0.5); l = Math.min(Math.max(l, 0.42), 0.58);
    var c = (1 - Math.abs(2 * l - 1)) * sat, x = c * (1 - Math.abs((h / 60) % 2 - 1)), m = l - c / 2, R, G, B;
    switch (Math.floor(h / 60)) {
      case 0: R = c; G = x; B = 0; break;
      case 1: R = x; G = c; B = 0; break;
      case 2: R = 0; G = c; B = x; break;
      case 3: R = 0; G = x; B = c; break;
      case 4: R = x; G = 0; B = c; break;
      default: R = c; G = 0; B = x;
    }
    return '#' + hex2(Math.round((R + m) * 255)) + hex2(Math.round((G + m) * 255)) + hex2(Math.round((B + m) * 255));
  }
  var themeNow = '';
  function setTheme(hex) {
    if (!hex || hex === themeNow) return;
    themeNow = hex;
    var n = parseInt(hex.replace('#', ''), 16);
    stage.style.setProperty('--t', hex);
    stage.style.setProperty('--t-rgb', ((n >> 16) & 255) + ',' + ((n >> 8) & 255) + ',' + (n & 255));
    stage.style.setProperty('--t2', hueShift(hex, 32));
  }

  var colorCache = {};
  function iconColor(app, cb) {
    var key = app.pkg;
    if (colorCache[key]) { cb(colorCache[key]); return; }
    if (!app.icon) { cb('#3b82f6'); return; }
    var img = new Image();
    img.onload = function () {
      var out = '#3b82f6';
      try {
        var c = document.createElement('canvas'); c.width = 16; c.height = 16;
        var x = c.getContext('2d'); x.drawImage(img, 0, 0, 16, 16);
        var d = x.getImageData(0, 0, 16, 16).data, r = 0, g = 0, b = 0, w = 0;
        for (var i = 0; i < d.length; i += 4) {
          if (d[i + 3] < 128) continue;
          var mx = Math.max(d[i], d[i + 1], d[i + 2]), mn = Math.min(d[i], d[i + 1], d[i + 2]);
          var s = (mx - mn) + 8;
          r += d[i] * s; g += d[i + 1] * s; b += d[i + 2] * s; w += s;
        }
        if (w > 0) {
          r = Math.round(r / w); g = Math.round(g / w); b = Math.round(b / w);
          out = (Math.max(r, g, b) < 70) ? '#94a3b8' : ('#' + hex2(r) + hex2(g) + hex2(b));
        }
      } catch (e) {}
      colorCache[key] = out; cb(out);
    };
    img.onerror = function () { colorCache[key] = '#3b82f6'; cb('#3b82f6'); };
    img.src = app.icon;
  }

  var toastT = null;
  function toast(msg) {
    toastEl.textContent = msg; toastEl.classList.add('show');
    clearTimeout(toastT);
    toastT = setTimeout(function () { toastEl.classList.remove('show'); }, 2600);
  }

  /* กด/แตะ + กดค้าง (สำหรับมือถือและเมาส์) */
  function bindPress(el, onTap, onLong) {
    var t = null, fired = false, sx = 0, sy = 0;
    el.addEventListener('pointerdown', function (e) {
      fired = false; sx = e.clientX; sy = e.clientY;
      clearTimeout(t);
      t = setTimeout(function () { fired = true; onLong(); }, 600);
    });
    el.addEventListener('pointermove', function (e) {
      if (Math.abs(e.clientX - sx) > 12 || Math.abs(e.clientY - sy) > 12) clearTimeout(t);
    });
    el.addEventListener('pointerup', function () { clearTimeout(t); });
    el.addEventListener('pointercancel', function () { clearTimeout(t); });
    el.addEventListener('pointerleave', function () { clearTimeout(t); });
    el.addEventListener('contextmenu', function (e) { e.preventDefault(); });
    el.addEventListener('click', function () {
      if (fired) { fired = false; return; }
      onTap();
    });
  }

  /* ---------- Storage (Pins) ---------- */
  function loadPins() {
    try {
      var raw = NATIVE ? window.Android.loadPins() : localStorage.getItem('gos.pins');
      var a = JSON.parse(raw || '[]');
      return Array.isArray(a) ? a : [];
    } catch (e) { return []; }
  }
  function savePins() {
    var s = JSON.stringify(state.pins.concat(state.hidden.map(function (id) { return { hide: id }; })));
    try { if (NATIVE) window.Android.savePins(s); else localStorage.setItem('gos.pins', s); } catch (e) {}
  }
  function findApp(pkg) {
    for (var i = 0; i < state.apps.length; i++) if (state.apps[i].pkg === pkg) return state.apps[i];
    return null;
  }
  function isPinned(pkg) {
    for (var i = 0; i < state.pins.length; i++) if (state.pins[i].pkg === pkg) return true;
    return false;
  }
  function findDefault(id) {
    for (var i = 0; i < DEFAULTS.length; i++) if (DEFAULTS[i].id === id) return DEFAULTS[i];
    return null;
  }
  function defaultByPkg(pkg) {
    for (var i = 0; i < DEFAULTS.length; i++) if (DEFAULTS[i].pkgs.indexOf(pkg) >= 0) return DEFAULTS[i];
    return null;
  }
  function isHidden(id) { return state.hidden.indexOf(id) >= 0; }
  function isDefaultPkg(pkg) { var d = defaultByPkg(pkg); return !!d && !isHidden(d.id); }
  /* แปลงปุ่มหลักให้อยู่ในรูปแอป เพื่อใช้กับเมนูกดค้าง */
  function dockApp(it) {
    if (it.kind === 'pin') return it.app;
    return { pkg: it.pkgs[0], label: it.name, defaultId: it.id, color: it.color, svg: ICON[it.glyph] ? it.glyph : null, text: it.glyph === 'N' ? 'N' : '' };
  }

  /* ---------- Launch ---------- */
  function launchPkg(pkg, label) {
    if (NATIVE) { if (!window.Android.launch(pkg)) toast('เปิด ' + label + ' ไม่ได้'); }
    else toast('(Demo) เปิด ' + label + ' · ' + pkg);
  }
  function launchDefault(it) {
    if (NATIVE) {
      for (var i = 0; i < it.pkgs.length; i++) { if (window.Android.launch(it.pkgs[i])) return; }
      toast(it.name + ' ยังไม่ได้ติดตั้ง — กำลังเปิด Play Store');
      window.Android.openStore(it.pkgs[0]);
    } else toast('(Demo) เปิด ' + it.name);
  }

  /* ---------- Dock ---------- */
  function buildDock() {
    var items = DEFAULTS.filter(function (d) { return !isHidden(d.id); }).map(function (d) {
      return { kind: 'default', id: d.id, name: d.name, desc: d.desc, glyph: d.glyph, color: d.color, pkgs: d.pkgs };
    });
    state.pins.forEach(function (p) {
      var a = findApp(p.pkg);
      if (a) items.push({ kind: 'pin', id: 'pin:' + a.pkg, name: a.label, desc: 'แอปที่ปักหมุดไว้ในหน้าหลัก', color: '#3b82f6', app: a });
    });
    items.push({ kind: 'all', id: ALL.id, name: ALL.name, desc: ALL.desc, glyph: ALL.glyph, color: ALL.color });
    return items;
  }

  function renderDock() {
    state.dockItems = buildDock();
    if (state.focus > state.dockItems.length - 1) state.focus = state.dockItems.length - 1;
    dock.innerHTML = '';
    state.dockItems.forEach(function (it, i) {
      var el = document.createElement('div');
      el.className = 'app-icon' + (i === state.focus ? ' focused' : '');
      el.style.setProperty('--c', it.color);
      el.style.setProperty('--g', rgba(it.color, 0.6));
      if (it.kind === 'pin') {
        if (it.app.icon) {
          var im = new Image(); im.src = it.app.icon; im.draggable = false; el.appendChild(im);
        } else el.textContent = it.app.label.charAt(0);
        iconColor(it.app, function (c) { el.style.setProperty('--g', rgba(c, 0.6)); });
      } else if (it.glyph === 'N') {
        el.textContent = 'N';
      } else {
        el.innerHTML = ICON[it.glyph];
      }
      bindPress(el,
        function () { setFocus(i); activateDock(i); },
        function () { if (it.kind === 'pin' || it.kind === 'default') { setFocus(i); openMenu(dockApp(it), 'dock'); } });
      dock.appendChild(el);
    });
  }

  function themeForDock() {
    var it = state.dockItems[state.focus]; if (!it) return;
    if (it.kind === 'pin') iconColor(it.app, function (c) { if (state.dockItems[state.focus] === it && state.mode !== 'drawer') setTheme(c); });
    else setTheme(it.color);
  }

  var labelT = null;
  function setLabelNow() {
    var it = state.dockItems[state.focus]; if (!it) return;
    themeForDock();
    nameEl.textContent = it.name; descEl.textContent = it.desc;
    labelBox.style.opacity = '1'; labelBox.style.transform = 'translateY(0)';
  }
  function updateLabel() {
    var it = state.dockItems[state.focus]; if (!it) return;
    themeForDock();
    labelBox.style.opacity = '0';
    labelBox.style.transform = 'translateY(10px)';
    clearTimeout(labelT);
    labelT = setTimeout(function () {
      nameEl.textContent = it.name; descEl.textContent = it.desc;
      labelBox.style.opacity = '1'; labelBox.style.transform = 'translateY(0)';
    }, 150);
  }

  function setFocus(i) {
    if (i === state.focus) return;
    var kids = dock.children;
    if (kids[state.focus]) kids[state.focus].classList.remove('focused');
    state.focus = i;
    if (kids[i]) kids[i].classList.add('focused');
    updateLabel();
  }

  function activateDock(i) {
    var it = state.dockItems[i]; if (!it) return;
    if (it.kind === 'all') openDrawer();
    else if (it.kind === 'pin') launchPkg(it.app.pkg, it.app.label);
    else launchDefault(it);
  }

  /* ---------- Drawer ---------- */
  function allApps() { return BUILTINS.concat(state.apps); }

  function buildGrid() {
    state.drawerList = allApps();
    grid.innerHTML = '';
    state.drawerList.forEach(function (a, i) {
      var t = document.createElement('div'); t.className = 'tile'; t.setAttribute('data-pkg', a.pkg);
      var wrap = document.createElement('div'); wrap.className = 't-wrap';
      var ic = document.createElement('div'); ic.className = 't-icon';
      if (a.icon) { var im = new Image(); im.src = a.icon; im.draggable = false; ic.appendChild(im); }
      else if (a.svg) { ic.innerHTML = ICON[a.svg]; }
      else { ic.textContent = a.label.charAt(0); }
      wrap.appendChild(ic);
      var nm = document.createElement('div'); nm.className = 't-name'; nm.textContent = a.label;
      t.appendChild(wrap); t.appendChild(nm);
      bindPress(t,
        function () { setDrawerFocus(i); closeDrawer(); launchPkg(a.pkg, a.label); },
        function () { setDrawerFocus(i); openMenu(a, 'drawer'); });
      grid.appendChild(t);
    });
    refreshBadges();
  }

  function refreshBadges() {
    var tiles = grid.children;
    for (var i = 0; i < tiles.length; i++) {
      var pkg = tiles[i].getAttribute('data-pkg');
      var wrap = tiles[i].firstChild;
      var old = wrap.querySelector('.badge'); if (old) wrap.removeChild(old);
      if (isPinned(pkg) || isDefaultPkg(pkg)) {
        var b = document.createElement('div'); b.className = 'badge'; b.innerHTML = ICON.pin; wrap.appendChild(b);
      }
    }
  }

  function setDrawerFocus(i) {
    var tiles = grid.children;
    if (tiles[state.drawerFocus]) tiles[state.drawerFocus].classList.remove('focused');
    state.drawerFocus = i;
    var el = tiles[i]; if (!el) return;
    el.classList.add('focused');
    var a = state.drawerList[i];
    iconColor(a, function (c) { el.style.setProperty('--g', rgba(c, 0.6)); if (state.mode === 'drawer' && state.drawerFocus === i) setTheme(c); });
    var top = el.offsetTop, bottom = top + el.offsetHeight;
    if (top < grid.scrollTop + 10) grid.scrollTop = Math.max(0, top - 20);
    else if (bottom > grid.scrollTop + grid.clientHeight - 10) grid.scrollTop = bottom - grid.clientHeight + 40;
  }

  function openDrawer() {
    state.mode = 'drawer';
    buildGrid();
    grid.scrollTop = 0;
    state.drawerFocus = 0;
    setDrawerFocus(0);
    drawer.classList.add('open');
  }
  function closeDrawer() {
    state.mode = 'home';
    drawer.classList.remove('open');
    themeForDock();
  }
  $('drawerClose').addEventListener('click', function () { if (state.mode === 'drawer') closeDrawer(); });

  function navDrawer(k) {
    var n = state.drawerList.length, i = state.drawerFocus;
    if (k === 'left') i = Math.max(0, i - 1);
    else if (k === 'right') i = Math.min(n - 1, i + 1);
    else if (k === 'up') { if (i - COLS >= 0) i -= COLS; }
    else if (k === 'down') {
      if (i + COLS < n) i += COLS;
      else if (Math.floor(i / COLS) < Math.floor((n - 1) / COLS)) i = n - 1;
    }
    if (i !== state.drawerFocus) setDrawerFocus(i);
  }

  /* ---------- Pin / Unpin ---------- */
  function pinApp(a) {
    var d = a.defaultId ? findDefault(a.defaultId) : defaultByPkg(a.pkg);
    if (d) {
      var k = state.hidden.indexOf(d.id); if (k < 0) return;
      state.hidden.splice(k, 1);
      savePins(); renderDock(); setLabelNow(); refreshBadges();
      toast('ปักหมุด ' + d.name + ' ไว้ที่หน้าหลักแล้ว');
      return;
    }
    if (state.pins.length >= MAX_PINS) { toast('หน้าหลักเต็มแล้ว (ปักหมุดได้สูงสุด ' + MAX_PINS + ' แอป)'); return; }
    if (isPinned(a.pkg)) return;
    state.pins.push({ pkg: a.pkg, label: a.label });
    savePins(); renderDock(); refreshBadges();
    toast('ปักหมุด ' + a.label + ' ไว้ที่หน้าหลักแล้ว');
  }
  function unpinApp(a) {
    var d = a.defaultId ? findDefault(a.defaultId) : defaultByPkg(a.pkg);
    if (d) { if (!isHidden(d.id)) state.hidden.push(d.id); }
    else state.pins = state.pins.filter(function (p) { return p.pkg !== a.pkg; });
    savePins(); renderDock(); setLabelNow(); refreshBadges();
    toast('เลิกปักหมุด ' + (d ? d.name : a.label) + ' แล้ว');
  }

  /* ---------- Context menu ---------- */
  function openMenu(app, from) {
    var items = [];
    items.push({ label: 'Open', run: function () {
      closeMenu(); if (from === 'drawer') closeDrawer();
      if (app.defaultId) launchDefault(findDefault(app.defaultId)); else launchPkg(app.pkg, app.label);
    } });
    if (!app.builtin) {
      var d0 = app.defaultId ? findDefault(app.defaultId) : defaultByPkg(app.pkg);
      var onHome = d0 ? !isHidden(d0.id) : isPinned(app.pkg);
      if (onHome) items.push({ label: 'Unpin from Home', run: function () { closeMenu(); unpinApp(app); } });
      else items.push({ label: 'Pin to Home', run: function () { closeMenu(); pinApp(app); } });
      if (!app.defaultId) items.push({ label: 'App Info', run: function () {
        closeMenu(); if (NATIVE) window.Android.appInfo(app.pkg); else toast('(Demo) App Info · ' + app.pkg);
      } });
    }
    state.menuItems = items; state.menuFocus = 0; state.menuApp = app; state.menuFrom = from;

    menuEl.innerHTML = '';
    var head = document.createElement('div'); head.className = 'menu-head';
    var mi = document.createElement('div'); mi.className = 'mi';
    if (app.icon) { var im = new Image(); im.src = app.icon; mi.appendChild(im); }
    else if (app.svg) { mi.innerHTML = ICON[app.svg]; mi.style.color = '#fff'; mi.firstChild.setAttribute('width', 36); mi.firstChild.setAttribute('height', 36); if (app.color) mi.style.background = app.color; }
    else if (app.text) { mi.textContent = app.text; mi.style.color = '#fff'; mi.style.fontSize = '34px'; mi.style.fontWeight = '800'; mi.style.background = app.color; }
    var tt = document.createElement('div'); tt.className = 'menu-title'; tt.textContent = app.label;
    head.appendChild(mi); head.appendChild(tt); menuEl.appendChild(head);

    items.forEach(function (it, i) {
      var el = document.createElement('div');
      el.className = 'menu-item' + (i === 0 ? ' focused' : '') + (it.disabled ? ' disabled' : '');
      el.textContent = it.label;
      el.addEventListener('click', function () { state.menuFocus = i; it.run(); });
      menuEl.appendChild(el);
    });
    state.mode = 'menu';
    menuWrap.classList.add('open');
  }
  function closeMenu() {
    menuWrap.classList.remove('open');
    state.mode = (state.menuFrom === 'dock') ? 'home' : 'drawer';
  }
  menuWrap.addEventListener('click', function (e) { if (e.target === menuWrap && state.mode === 'menu') closeMenu(); });

  function navMenu(k) {
    var n = state.menuItems.length, i = state.menuFocus;
    if (k === 'up') i = Math.max(0, i - 1);
    else if (k === 'down') i = Math.min(n - 1, i + 1);
    if (i === state.menuFocus) return;
    var kids = menuEl.querySelectorAll('.menu-item');
    kids[state.menuFocus].classList.remove('focused');
    state.menuFocus = i;
    kids[i].classList.add('focused');
  }

  /* ---------- Remote / keyboard ---------- */
  function keyName(e) {
    switch (e.key) {
      case 'ArrowLeft': return 'left';
      case 'ArrowRight': return 'right';
      case 'ArrowUp': return 'up';
      case 'ArrowDown': return 'down';
      case 'Enter': return 'enter';
      case 'Escape': case 'Backspace': case 'BrowserBack': return 'back';
    }
    switch (e.keyCode) {
      case 37: return 'left';
      case 39: return 'right';
      case 38: return 'up';
      case 40: return 'down';
      case 13: case 23: return 'enter';
      case 27: return 'back';
    }
    return null;
  }

  function nav(k) {
    if (state.mode === 'home') {
      if (k === 'left') setFocus(Math.max(0, state.focus - 1));
      else if (k === 'right') setFocus(Math.min(state.dockItems.length - 1, state.focus + 1));
    } else if (state.mode === 'drawer') navDrawer(k);
    else if (state.mode === 'menu') navMenu(k);
  }

  function back() {
    if (state.mode === 'menu') closeMenu();
    else if (state.mode === 'drawer') closeDrawer();
  }

  function onShort() {
    if (state.mode === 'home') activateDock(state.focus);
    else if (state.mode === 'drawer') {
      var a = state.drawerList[state.drawerFocus];
      if (a) { closeDrawer(); launchPkg(a.pkg, a.label); }
    } else if (state.mode === 'menu') {
      var it = state.menuItems[state.menuFocus]; if (it) it.run();
    }
  }
  function onLong() {
    if (state.mode === 'home') {
      var it = state.dockItems[state.focus];
      if (it && (it.kind === 'pin' || it.kind === 'default')) openMenu(dockApp(it), 'dock');
    } else if (state.mode === 'drawer') {
      var a = state.drawerList[state.drawerFocus];
      if (a) openMenu(a, 'drawer');
    }
  }

  var pressT = null, longFired = false, enterDown = false;
  function resetPress() { clearTimeout(pressT); enterDown = false; longFired = false; }

  document.addEventListener('keydown', function (e) {
    var k = keyName(e); if (!k) return;
    e.preventDefault();
    if (k === 'enter') {
      if (enterDown) return;
      enterDown = true; longFired = false;
      clearTimeout(pressT);
      pressT = setTimeout(function () { longFired = true; onLong(); }, LONG_MS);
      return;
    }
    if (k === 'back') { back(); return; }
    nav(k);
  });
  document.addEventListener('keyup', function (e) {
    if (keyName(e) !== 'enter') return;
    e.preventDefault();
    if (!enterDown) return;
    clearTimeout(pressT); enterDown = false;
    if (!longFired) onShort();
    longFired = false;
  });
  window.addEventListener('blur', resetPress);

  /* ---------- Clock / Network ---------- */
  var DAYS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  var MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  function tick() {
    var d = new Date();
    clockEl.textContent = String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
    dateEl.textContent = DAYS[d.getDay()] + ', ' + d.getDate() + ' ' + MONTHS[d.getMonth()];
  }
  function refreshNet() {
    var t = 'wifi';
    if (NATIVE) { try { t = window.Android.network(); } catch (e) {} }
    netEl.innerHTML = NET[t === 'ethernet' ? 'ethernet' : (t === 'none' ? 'none' : 'wifi')];
  }

  /* ---------- Native callbacks ---------- */
  window.GOS = {
    setApps: function (list) {
      var prev = state.dockItems[state.focus] ? state.dockItems[state.focus].id : null;
      state.apps = list || [];
      if (state.apps.length) {
        var before = state.pins.length;
        state.pins = state.pins.filter(function (p) { return !!findApp(p.pkg); });
        if (state.pins.length !== before) savePins();
      }
      var items = buildDock();
      if (prev) { for (var i = 0; i < items.length; i++) if (items[i].id === prev) { state.focus = i; break; } }
      renderDock(); setLabelNow();
      if (state.mode === 'drawer') {
        var keep = state.drawerFocus; buildGrid();
        setDrawerFocus(Math.min(keep, state.drawerList.length - 1));
      }
    },
    back: back,
    home: function () {
      resetPress();
      menuWrap.classList.remove('open');
      drawer.classList.remove('open');
      state.mode = 'home';
      if (state.focus !== 0) { setFocus(0); }
      themeForDock();
    },
    resume: function () { tick(); refreshNet(); resetPress(); }
  };

  /* ---------- Demo apps (เปิดในเบราว์เซอร์เพื่อดูดีไซน์) ---------- */
  function demoIcon(letter, hue) {
    var svg = "<svg xmlns='http://www.w3.org/2000/svg' width='128' height='128'><rect width='128' height='128' fill='hsl(" + hue +
      ",65%,42%)'/><text x='64' y='86' font-size='64' font-weight='700' text-anchor='middle' fill='white' font-family='sans-serif'>" + letter + "</text></svg>";
    return 'data:image/svg+xml;utf8,' + encodeURIComponent(svg);
  }
  function demoApps() {
    var names = ['Disney+', 'Plex', 'VLC', 'Kodi', 'Chrome', 'Files', 'Photos', 'Games', 'Twitch', 'Music', 'Camera',
      'Maps', 'Weather', 'Clock', 'Notes', 'TV Guide', 'Cast', 'Browser', 'Radio', 'Podcasts', 'Fitness', 'News', 'Kids', 'Karaoke'];
    return names.map(function (n, i) {
      return { pkg: 'demo.' + n.toLowerCase().replace(/[^a-z]/g, ''), label: n, icon: demoIcon(n.charAt(0), (i * 47) % 360) };
    });
  }

  /* ---------- Init ---------- */
  var saved = loadPins();
  state.pins = saved.filter(function (p) { return p && p.pkg; });
  state.hidden = saved.filter(function (p) { return p && p.hide; }).map(function (p) { return p.hide; });
  renderDock();
  setLabelNow();
  tick(); refreshNet();
  setInterval(tick, 5000);
  setInterval(refreshNet, 5000);
  document.addEventListener('visibilitychange', function () { if (!document.hidden) { tick(); refreshNet(); resetPress(); } });

  if (NATIVE) window.Android.requestApps();
  else window.GOS.setApps(demoApps());
})();
</script>
</body>
